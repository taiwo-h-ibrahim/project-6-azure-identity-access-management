<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#315b82"/>
    </marker>
    <style>
      .title{font:700 34px Arial,Helvetica,sans-serif;fill:#183b60}
      .subtitle{font:400 20px Arial,Helvetica,sans-serif;fill:#58708a}
      .section{font:700 27px Arial,Helvetica,sans-serif;fill:#183b60}
      .head{font:700 25px Arial,Helvetica,sans-serif;fill:#183b60}
      .body{font:400 20px Arial,Helvetica,sans-serif;fill:#263f59}
      .small{font:400 18px Arial,Helvetica,sans-serif;fill:#58708a}
      .bold{font-weight:700}
      .mono{font:400 18px 'Courier New',monospace;fill:#263f59}
      .panel{fill:#fbfcfe;stroke:#91a8bf;stroke-width:2.2;stroke-dasharray:9 8}
      .card{fill:#fff;stroke:#477db8;stroke-width:2.2}
      .green{fill:#eef9f1;stroke:#4a9b68;stroke-width:2.2}
      .result{fill:#f7faff;stroke:#477db8;stroke-width:2.2}
      .allowed{fill:#edf9ed;stroke:#8acb8c;stroke-width:2}
      .denied{fill:#fff0f0;stroke:#e3a0a0;stroke-width:2}
      .arrow{stroke:#315b82;stroke-width:2.8;fill:none;marker-end:url(#arrow)}
      .line{stroke:#315b82;stroke-width:2.5;fill:none}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="48" text-anchor="middle" class="title">Project 6 — B2B External Guest RBAC</text>
  <text x="800" y="80" text-anchor="middle" class="subtitle">Microsoft Entra ID B2B guest access to Azure Storage</text>

  <!-- External guest -->
  <rect x="35" y="170" width="295" height="285" rx="18" class="card"/>
  <text x="182" y="213" text-anchor="middle" class="section">External Guest</text>
  <text x="182" y="245" text-anchor="middle" class="body">(Gmail account)</text>

  <!-- simple user icon -->
  <circle cx="132" cy="310" r="28" fill="#315b82"/>
  <path d="M91 365 Q132 325 173 365 L173 382 L91 382 Z" fill="#315b82"/>
  <rect x="206" y="288" width="61" height="44" rx="5" fill="none" stroke="#315b82" stroke-width="4"/>
  <path d="M206 293 L236 317 L267 293" fill="none" stroke="#315b82" stroke-width="3"/>
  <text x="182" y="415" text-anchor="middle" class="body">Gmail account</text>
  <text x="182" y="440" text-anchor="middle" class="small">(External identity)</text>

  <!-- invitation arrow -->
  <path d="M330 312 L505 312" class="arrow"/>
  <text x="417" y="270" text-anchor="middle" class="head" font-size="20">B2B Invitation</text>
  <text x="417" y="294" text-anchor="middle" class="small">(Email invite)</text>

  <!-- Entra group -->
  <rect x="505" y="150" width="510" height="310" rx="18" class="panel"/>
  <text x="760" y="195" text-anchor="middle" class="section">Microsoft Entra ID (B2B)</text>

  <rect x="535" y="235" width="450" height="165" rx="17" class="card"/>
  <circle cx="620" cy="303" r="26" fill="#16a6c8"/>
  <path d="M582 356 Q620 318 658 356 L658 370 L582 370 Z" fill="#16a6c8"/>
  <text x="750" y="293" text-anchor="middle" class="head">HTI External Guest Test</text>
  <text x="750" y="328" text-anchor="middle" class="body">User type: Guest</text>
  <text x="750" y="358" text-anchor="middle" class="body">(B2B external user)</text>

  <!-- RBAC arrow -->
  <path d="M985 312 L1220 312" class="arrow"/>
  <text x="1102" y="270" text-anchor="middle" class="head" font-size="20">RBAC Assignment</text>
  <text x="1102" y="294" text-anchor="middle" class="small">(Storage Blob Data Reader)</text>

  <!-- Storage -->
  <rect x="1220" y="150" width="345" height="310" rx="18" class="panel"/>
  <text x="1392" y="195" text-anchor="middle" class="section">Azure Storage Account</text>

  <!-- storage icon -->
  <rect x="1270" y="235" width="72" height="58" rx="6" fill="#25a9a0"/>
  <path d="M1270 250 L1342 250 M1270 270 L1342 270" stroke="#ffffff" stroke-width="5"/>
  <text x="1450" y="269" text-anchor="middle" class="head" font-size="21">htiexternalguestlab01</text>

  <rect x="1260" y="325" width="265" height="95" rx="17" class="result"/>
  <!-- folder icon -->
  <path d="M1290 348 h36 l10 12 h48 v42 h-94 z" fill="#315b82"/>
  <text x="1412" y="365" text-anchor="middle" class="head" font-size="20">Blob Container</text>
  <text x="1412" y="397" text-anchor="middle" class="body">guest-access-test</text>

  <!-- CLI -->
  <path d="M760 400 L760 505" class="arrow"/>
  <rect x="585" y="505" width="350" height="100" rx="18" class="green"/>
  <rect x="620" y="530" width="57" height="48" rx="6" fill="#477db8"/>
  <path d="M632 542 L648 554 L632 566" fill="none" stroke="#fff" stroke-width="4"/>
  <line x1="654" y1="568" x2="668" y2="568" stroke="#fff" stroke-width="4"/>
  <text x="806" y="548" text-anchor="middle" class="head" font-size="22">Access via Azure CLI</text>
  <text x="806" y="579" text-anchor="middle" class="mono">(az login / az storage blob ...)</text>

  <!-- blob operations -->
  <path d="M760 605 L760 660" class="arrow"/>
  <rect x="315" y="660" width="970" height="190" rx="18" class="panel"/>
  <text x="800" y="705" text-anchor="middle" class="section">Blob Operations <tspan font-weight="400">(on guest-access-test)</tspan></text>

  <!-- allowed -->
  <rect x="350" y="730" width="270" height="88" rx="15" class="allowed"/>
  <text x="380" y="768" class="head" font-size="21" fill="#287b35">✓</text>
  <text x="405" y="765" class="head" font-size="20">Read</text>
  <text x="405" y="790" class="small">(show/download)</text>
  <text x="585" y="790" text-anchor="end" class="head" font-size="20" fill="#287b35">Allowed</text>

  <!-- denied write -->
  <rect x="665" y="730" width="270" height="88" rx="15" class="denied"/>
  <text x="695" y="768" class="head" font-size="21" fill="#c53a2f">×</text>
  <text x="720" y="765" class="head" font-size="20">Write</text>
  <text x="720" y="790" class="small">(upload)</text>
  <text x="900" y="790" text-anchor="end" class="head" font-size="20" fill="#c53a2f">Denied</text>

  <!-- denied delete -->
  <rect x="980" y="730" width="270" height="88" rx="15" class="denied"/>
  <text x="1010" y="768" class="head" font-size="21" fill="#c53a2f">×</text>
  <text x="1035" y="765" class="head" font-size="20">Delete</text>
  <text x="1215" y="790" text-anchor="end" class="head" font-size="20" fill="#c53a2f">Denied</text>
</svg>